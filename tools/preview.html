<!doctype html>
<html><head><meta charset="utf-8"><title>character preview</title>
<style>html,body{margin:0;background:#111;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.js", "three/addons/": "../vendor/three/addons/" } }</script>
</head><body>
<script>window.HM_ASSET_BASE = '../';</script>
<script type="module">
import * as THREE from 'three';
import { loadCharacter } from '../client/entities/character.js';
import { HeliumAnimator, SkunkAnimator } from '../client/entities/animators.js';
const P = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true });
r.setSize(innerWidth, innerHeight); r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x15171c);
const cam = new THREE.PerspectiveCamera(+(P.get('fov') || 35), innerWidth / innerHeight, 0.01, 100);
scene.add(new THREE.HemisphereLight(0xbbbbcc, 0x333333, 0.9));
const key = new THREE.DirectionalLight(0xfff4e8, 2.2); key.position.set(1, 2, 3); scene.add(key);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshStandardMaterial({ color: 0x333333 })); ground.rotation.x = -Math.PI / 2; scene.add(ground);
const which = P.get('c') || 'helium';
const ch = await loadCharacter(which);
scene.add(ch.root);
const anim = which === 'sf6' ? new SkunkAnimator(ch) : new HeliumAnimator(ch);
const params = JSON.parse(P.get('p') || '{}');
for (let i = 0; i < 30; i++) anim.update((+(P.get('t') || 0.5)) / 30, params);
const view = P.get('v') || 'face';
const top = ch.landmarks?.top?.[1] || 1.9;
const eyeY = ch.landmarks?.eyeL?.[1] || 1.74;
if (view === 'face') { cam.position.set(0, eyeY - 0.03, 0.62); cam.lookAt(0, eyeY - 0.04, 0); }
else if (view === 'body') { cam.position.set(0.6, 1.1, 3.8); cam.lookAt(0, 0.98, 0); }
else if (view === 'side') { cam.position.set(3.6, 1.0, 0.4); cam.lookAt(0, 0.95, 0); }
else if (view === 'back') { cam.position.set(-0.8, 1.2, -3.6); cam.lookAt(0, 0.98, 0); }
else if (view === 'skunk') { cam.position.set(1.6, 0.9, 2.0); cam.lookAt(0, 0.45, 0); }
else if (view === 'skunkf') { cam.position.set(0.2, 0.55, 1.9); cam.lookAt(0, 0.4, 0.6); }
r.render(scene, cam);
window.READY = true;
</script></body></html>
